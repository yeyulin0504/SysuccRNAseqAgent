<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYSU 多组学分析 Agent — 项目首页</title>
<style>
  :root {
    --bg: #0f1420; --panel: #1a2130; --border: #2b3550;
    --text: #e6e9f0; --muted: #8b94a8; --accent: #4da3ff;
    --ok: #3ecf8e; --warn: #f0b429; --err: #e05c5c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--text); }
  header { padding: 14px 24px; border-bottom: 1px solid var(--border);
           display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  nav { margin-left: auto; display: flex; gap: 10px; }
  nav a { color: var(--accent); text-decoration: none; font-size: 13px; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 20px;
           border: 1px solid var(--border); color: var(--muted); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px; }
  h2 { font-size: 14px; color: var(--muted); text-transform: uppercase;
       letter-spacing: .5px; margin: 22px 0 10px; }
  .card { background: var(--panel); border: 1px solid var(--border);
          border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 140px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 4px; }
  input { width: 100%; background: var(--bg); border: 1px solid var(--border);
        border-radius: 6px; color: var(--text); padding: 8px 10px; font-size: 13px; }
  button { background: var(--accent); color: #fff; border: none; border-radius: 6px;
           padding: 8px 16px; font-size: 13px; cursor: pointer; margin-top: 12px; }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .proj { display: flex; align-items: center; gap: 12px; padding: 12px 0;
          border-bottom: 1px solid var(--border); }
  .proj:last-child { border-bottom: none; }
  .proj .title { font-size: 14px; }
  .proj .meta { font-size: 12px; color: var(--muted); }
  .state { font-size: 11px; padding: 2px 8px; border-radius: 12px; }
  .state.drafting { background: rgba(139,148,168,.15); color: var(--muted); }
  .state.planned { background: rgba(77,163,255,.15); color: var(--accent); }
  .state.confirmed { background: rgba(62,207,142,.15); color: var(--ok); }
  .state.waiting_user { background: rgba(240,180,41,.18); color: var(--warn); }
  .state.completed { background: rgba(62,207,142,.15); color: var(--ok); }
  .state.failed { background: rgba(224,92,92,.15); color: var(--err); }
  .muted { color: var(--muted); font-size: 12px; }
  .err { color: var(--err); }
</style>
</head>
<body>
<header>
  <h1>SYSU 多组学分析 Agent</h1>
  <span class="badge">localhost</span>
  <nav>
    <a href="/workbench">分析工作台</a>
    <a href="/settings">设置</a>
  </nav>
</header>

<div class="wrap">
  <h2>新建项目</h2>
  <div class="card">
    <div class="row">
      <div><label>项目 ID</label><input id="projectId" placeholder="demo_001"></div>
      <div><label>项目名称</label><input id="title" placeholder="Bulk RNA 差异分析"></div>
      <div><label>负责人</label><input id="owner" placeholder="local_user"></div>
    </div>
    <div class="row">
      <div style="flex:3"><label>研究目标（描述）</label><input id="description" placeholder="比较两组肿瘤样本的差异表达与融合基因"></div>
    </div>
    <button onclick="createProject()">创建项目</button>
    <span id="createErr" class="err"></span>
  </div>

  <h2>项目列表</h2>
  <div class="card" id="projects">
    <div class="muted">加载中…</div>
  </div>
</div>

<script>
const TOKEN = "{{ token }}";
async function api(path, method, body) {
  const opts = { method: method || "GET", headers: { "content-type": "application/json", "x-session-token": TOKEN } };
  if (body) opts.body = JSON.stringify(body);
  const resp = await fetch(path, opts);
  return resp.json();
}
function stateClass(s) {
  return "state " + String(s || "drafting").toLowerCase().replace("waiting_user", "waiting_user");
}
function renderProjects(rows) {
  const el = document.getElementById("projects");
  if (!rows || !rows.length) { el.innerHTML = "<div class='muted'>还没有项目。在上方新建一个。</div>"; return; }
  el.innerHTML = rows.map(p => `
    <div class="proj">
      <div style="flex:2">
        <div class="title">${escapeHtml(p.title)}</div>
        <div class="meta">${escapeHtml(p.project_id)} · ${escapeHtml(p.owner || "—")} · 更新 ${escapeHtml(p.updated_at || "—")}</div>
      </div>
      <div><span class="${stateClass(p.state)}">${escapeHtml(p.state)}</span></div>
      <div class="meta">${p.thread_count || 0} 对话</div>
      <div>
        <a href="/workbench?project=${encodeURIComponent(p.project_id)}"><button class="secondary">打开</button></a>
        <button class="secondary" onclick="archiveProject('${escapeHtml(p.project_id)}')">归档</button>
      </div>
    </div>`).join("");
}
function loadProjects() {
  api("/api/projects").then(d => renderProjects(d.projects || []))
    .catch(() => { document.getElementById("projects").innerHTML = "<div class='err'>加载失败</div>"; });
}
function createProject() {
  const body = {
    project_id: document.getElementById("projectId").value.trim(),
    title: document.getElementById("title").value.trim(),
    owner: document.getElementById("owner").value.trim(),
    description: document.getElementById("description").value.trim(),
  };
  if (!body.project_id) { document.getElementById("createErr").textContent = "请填写项目 ID。"; return; }
  document.getElementById("createErr").textContent = "";
  api("/api/projects", "POST", body).then(d => {
    if (d.error) { document.getElementById("createErr").textContent = d.error; return; }
    loadProjects();
  });
}
function archiveProject(id) {
  if (!confirm("归档项目 " + id + "？分析数据不会删除，可随时恢复。")) return;
  api(`/api/projects/${encodeURIComponent(id)}/archive`, "POST", {}).then(d => {
    if (d.detail) { alert(d.detail); return; }
    loadProjects();
  });
}
function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
loadProjects();
</script>
</body>
</html>
