<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYSU 多组学分析 Agent — 对话</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f6f8fa; --border: #d0d7de;
    --text: #1f2328; --muted: #656d76; --accent: #0969da;
    --accent-weak: #ddf4ff; --ok: #1a7f37; --warn: #9a6700; --err: #cf222e;
    --shadow: 0 1px 2px rgba(31,35,40,.06);
    --user-bubble: #ddf4ff; --agent-bubble: #ffffff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--text); font-size: 14px; }
  header { padding: 11px 22px; border-bottom: 1px solid var(--border);
           display: flex; align-items: center; gap: 14px; background: var(--panel); }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .crumb { color: var(--muted); font-size: 13px; }
  nav { margin-left: auto; display: flex; gap: 12px; align-items: center; }
  nav a { color: var(--accent); text-decoration: none; font-size: 13px; }
  nav a:hover { text-decoration: underline; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 20px;
           border: 1px solid var(--border); color: var(--muted); background: var(--bg); }
  .state { font-size: 12px; padding: 3px 10px; border-radius: 20px; white-space: nowrap;
           background: rgba(101,109,118,.14); color: var(--muted); }
  .state.planned { background: rgba(9,105,218,.12); color: var(--accent); }
  .state.confirmed, .state.completed { background: rgba(26,127,55,.12); color: var(--ok); }
  .state.waiting_user, .state.waiting { background: rgba(154,103,0,.14); color: var(--warn); }
  .state.failed, .state.error { background: rgba(207,34,46,.12); color: var(--err); }

  /* ---- 两栏：左对话列表 + 右大片消息流 ---- */
  .shell { display: grid; grid-template-columns: 258px minmax(0, 1fr); height: calc(100vh - 55px); }
  .side { border-right: 1px solid var(--border); padding: 12px; overflow: auto; background: var(--panel); }
  .side h2 { font-size: 11px; color: var(--muted); text-transform: uppercase;
             letter-spacing: .5px; margin: 12px 0 6px; }
  .side h2:first-child { margin-top: 0; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px;
             margin-bottom: 4px; border: 1px solid transparent; }
  .list li:hover { background: var(--bg); }
  .list li.active { background: var(--accent-weak); border-color: var(--accent); }
  .list .sub { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .list .muted { color: var(--muted); font-size: 12px; padding: 6px 2px; }
  .side .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

  button { background: var(--accent); color: #fff; border: none; border-radius: 6px;
           padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  button.secondary { background: var(--bg); border: 1px solid var(--border); color: var(--text); }
  button.secondary:hover { background: var(--panel); }
  button.small { padding: 4px 10px; font-size: 12px; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  /* ---- 主区：消息流 ---- */
  /* min-height:0 是关键：flex 子项默认 min-height:auto，会被内容撑高，
     导致 .stream 自身不滚动（overflow 失效）、scrollTop 写在它身上没反应。
     min-height:0 让 .stream 成为真正受限的滚动容器。 */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .stream { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-anchor: none;
            padding: 26px 0 12px; }
  .stream-inner { max-width: 860px; margin: 0 auto; padding: 0 26px; }

  .turn { margin-bottom: 26px; display: flex; gap: 12px; }
  .turn .who { flex: 0 0 34px; height: 34px; border-radius: 8px; display: flex;
               align-items: center; justify-content: center; font-size: 12px;
               font-weight: 700; border: 1px solid var(--border); background: var(--panel); }
  .turn.user .who { background: var(--user-bubble); border-color: var(--accent); color: var(--accent); }
  .turn.agent .who { background: var(--panel); color: var(--muted); }
  .turn .body { flex: 1; min-width: 0; }
  .turn .bubble { border: 1px solid var(--border); background: var(--agent-bubble);
                  border-radius: 10px; padding: 12px 15px; box-shadow: var(--shadow);
                  white-space: pre-wrap; word-break: break-word; line-height: 1.62; }
  .turn.user .bubble { background: var(--user-bubble); border-color: rgba(9,105,218,.35); }
  .turn .stamp { font-size: 11px; color: var(--muted); margin-top: 5px; }
  .turn.agent .bubble.plain { background: transparent; border: none; box-shadow: none;
                              padding: 2px 0; }

  /* ---- 思考过程（折叠块，像 Codex 一样可展开） ---- */
  details.think { margin: 0 0 10px; border: 1px solid var(--border); border-radius: 9px;
                  background: var(--panel); overflow: hidden; }
  details.think > summary { cursor: pointer; padding: 7px 12px; font-size: 12px;
                            color: var(--muted); user-select: none; list-style: none; }
  details.think > summary::-webkit-details-marker { display: none; }
  details.think > summary::before { content: "▸ "; }
  details.think[open] > summary::before { content: "▾ "; }
  details.think .think-body { padding: 2px 12px 10px; border-top: 1px dashed var(--border); }
  .tstep { display: flex; gap: 8px; align-items: baseline; font-size: 12px;
           padding: 4px 0; color: var(--muted); }
  .tstep .dot { flex: 0 0 8px; width: 8px; height: 8px; border-radius: 50%;
                background: var(--border); margin-top: 5px; }
  .tstep.running .dot { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
  .tstep.done .dot { background: var(--ok); }
  .tstep.failed .dot { background: var(--err); }
  .tstep .lbl { color: var(--text); font-weight: 600; }
  .tstep .det { color: var(--muted); font-size: 11px; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

  .caret { display: inline-block; width: 7px; height: 14px; background: var(--accent);
           vertical-align: text-bottom; margin-left: 2px; animation: pulse 1s step-end infinite; }

  .errbox { background: rgba(207,34,46,.08); border: 1px solid rgba(207,34,46,.3);
            color: var(--err); padding: 8px 10px; border-radius: 8px; font-size: 12px;
            margin-top: 8px; white-space: pre-wrap; }

  /* ---- 高风险操作的确认卡片（写盘 / 执行必须人工批准） ---- */
  .confirm-card { border: 1px solid rgba(210,153,34,.5); border-radius: 10px;
                  background: rgba(210,153,34,.07); padding: 12px 14px; margin-top: 8px; }
  .confirm-card .head { font-size: 13px; font-weight: 600; color: var(--warn); margin-bottom: 8px; }
  .confirm-card .call { border-top: 1px dashed rgba(210,153,34,.35); padding: 8px 0; font-size: 12px; }
  .confirm-card .call:first-of-type { border-top: none; padding-top: 0; }
  .confirm-card .call .name { font-weight: 600; color: var(--text); }
  .confirm-card .call .risk { font-size: 10px; padding: 1px 6px; border-radius: 999px;
                              margin-left: 6px; background: rgba(207,34,46,.14); color: var(--err); }
  .confirm-card .call .risk.write { background: rgba(210,153,34,.18); color: var(--warn); }
  .confirm-card .call .desc { color: var(--muted); margin-top: 4px; white-space: pre-wrap;
                              font-family: Consolas, monospace; font-size: 11px; }
  .confirm-card .note { width: 100%; margin-top: 10px; min-height: 40px; max-height: 120px;
                        font-size: 12px; padding: 7px 9px; }
  .confirm-card .acts { display: flex; gap: 8px; margin-top: 10px; }
  .confirm-card .acts button { padding: 7px 16px; font-size: 13px; }
  .confirm-card .acts button.approve { background: var(--ok); border-color: var(--ok); color: #fff; }
  .confirm-card .acts button.reject { background: transparent; border: 1px solid var(--err);
                                      color: var(--err); }
  .confirm-card .settled { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .step { font-size: 12px; color: var(--muted); padding: 2px 0; }
  .gate { font-size: 12px; color: var(--warn); padding: 2px 0; }
  .muted { color: var(--muted); font-size: 12px; }
  .hidden { display: none !important; }

  /* ---- 底部输入区 ---- */
  .composer-wrap { border-top: 1px solid var(--border); background: var(--bg); padding: 12px 0 16px; }
  .composer-inner { max-width: 860px; margin: 0 auto; padding: 0 26px; }
  .quick-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .composer { display: flex; gap: 10px; align-items: flex-end; }
  textarea { flex: 1; min-height: 62px; max-height: 220px; resize: vertical;
             background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
             color: var(--text); padding: 10px 12px; font-size: 14px;
             font-family: "Segoe UI", "Microsoft YaHei", sans-serif; line-height: 1.5; }
  textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(9,105,218,.12); }
  .composer button { padding: 11px 20px; }
  .composer-hint { font-size: 11px; color: var(--muted); margin-top: 7px; }
</style>
</head>
<body>
<header>
  <h1>SYSU 多组学分析 Agent</h1>
  <span class="badge">对话</span>
  <span class="crumb" id="projectName">未选择项目</span>
  <span id="stateBadge" class="state">idle</span>
  <nav>
    <a href="/">项目首页</a>
    <a href="/workbench">分析工作台</a>
    <a href="/settings">设置</a>
  </nav>
</header>

<div class="shell">
  <!-- ============ 左栏：项目 + 对话列表 ============ -->
  <div class="side">
    <h2>项目</h2>
    <ul class="list" id="projectList"><li class="muted">加载中…</li></ul>

    <h2>对话</h2>
    <ul class="list" id="threadList"><li class="muted">请先选择项目。</li></ul>
    <div class="row">
      <button class="small" id="newChat" onclick="newThread()">＋ 新对话</button>
      <button class="small secondary" onclick="renameThread()">重命名</button>
    </div>
  </div>

  <!-- ============ 右栏：大片消息流 + 输入框 ============ -->
  <div class="main">
    <div class="stream" id="chatStream">
      <div class="stream-inner">
        <div class="muted" id="emptyHint">选择左侧对话，或在下方直接提问。</div>
      </div>
    </div>

    <div class="composer-wrap">
      <div class="composer-inner">
        <div class="quick-row">
          <button class="small secondary" onclick="quickAsk('生成执行计划')">生成计划</button>
          <button class="small secondary" onclick="quickAsk('解释当前门禁')">解释当前门禁</button>
          <button class="small secondary" onclick="quickAsk('浏览我的服务器目录')">浏览服务器目录</button>
          <button class="small secondary" onclick="quickAsk('当前状态如何')">当前状态</button>
        </div>
        <div class="composer" id="chatComposer">
          <textarea id="chatInput" rows="3"
            placeholder="问点什么，或直接说「生成计划」「把线程改成 16」…（Enter 发送，Shift+Enter 换行）"></textarea>
          <button id="chatSend" onclick="sendMessage()">发送</button>
        </div>
        <div class="composer-hint" id="viaHint"></div>
      </div>
    </div>
  </div>
</div>

<script>
const TOKEN = "{{ token }}";
const INITIAL_PROJECT = "{{ project_id }}";
const INITIAL_THREAD = "{{ thread_id }}";
let currentProject = INITIAL_PROJECT || "";
let currentThread = INITIAL_THREAD || "";
let streaming = false;

/* ---------------- 基础工具 ---------------- */
async function api(method, path, body) {
  const opts = { method, headers: { "x-session-token": TOKEN } };
  if (body !== undefined) {
    opts.headers["content-type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const resp = await fetch(path, opts);
  if (!resp.ok) {
    const text = await resp.text();
    return { error: text, status: resp.status };
  }
  return resp.json();
}

function wizardPath(rel) {
  return "/api/projects/" + encodeURIComponent(currentProject) + rel;
}

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/&#39;/g, "&#39;");
}

function humanTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso).slice(0, 19).replace("T", " ");
  return d.toLocaleString();
}

function setState(state) {
  const badge = document.getElementById("stateBadge");
  const s = String(state || "idle");
  badge.textContent = s;
  badge.className = "state " + s.toLowerCase();
}

/* ---------------- 项目 / 对话列表 ---------------- */
function loadProjects() {
  api("GET", "/api/projects").then(d => {
    const el = document.getElementById("projectList");
    const rows = d.projects || [];
    if (!rows.length) {
      el.innerHTML = "<li class='muted'>还没有项目，请到「项目首页」新建。</li>";
      return;
    }
    el.innerHTML = rows.map(p => `
      <li class="${p.project_id === currentProject ? 'active' : ''}"
          onclick="selectProject('${escapeHtml(p.project_id)}')">
        <div>${escapeHtml(p.title || p.project_id)}</div>
        <div class="sub">${escapeHtml(p.visible_state || p.state || '')}</div>
      </li>`).join("");
  });
}

function selectProject(id) {
  currentProject = id;
  currentThread = "";
  const url = new URL(window.location.href);
  url.searchParams.set("project", id);
  url.searchParams.delete("thread");
  history.pushState({}, "", url);
  document.getElementById("projectName").textContent = id;
  document.getElementById("emptyHint") && (document.getElementById("emptyHint").textContent = "");
  clearStream();
  loadProjects();
  loadThreads();
  refreshState();
}

function renderThreads(rows) {
  const el = document.getElementById("threadList");
  if (!currentProject) { el.innerHTML = "<li class='muted'>请先选择项目。</li>"; return; }
  if (!rows || !rows.length) { el.innerHTML = "<li class='muted'>该项目还没有对话。</li>"; return; }
  el.innerHTML = rows.map(t => `
    <li class="${t.thread_id === currentThread ? 'active' : ''}"
        onclick="selectThread('${escapeHtml(t.thread_id)}')">
      <div>${escapeHtml(t.title || t.thread_id)}</div>
      <div class="sub">${t.message_count || 0} 条消息</div>
    </li>`).join("");
}

function loadThreads() {
  if (!currentProject) { renderThreads([]); return; }
  api("GET", wizardPath("/threads")).then(d => {
    const rows = d.threads || [];
    renderThreads(rows);
    // 未指定对话时自动选中最近一个，避免新消息无处落盘。
    if (!currentThread && rows.length) {
      currentThread = rows[0].thread_id;
      renderThreads(rows);
      loadMessages();
    } else if (currentThread) {
      loadMessages();
    }
  });
}

function selectThread(tid) {
  currentThread = tid;
  const url = new URL(window.location.href);
  url.searchParams.set("thread", tid);
  history.pushState({}, "", url);
  loadThreads();
}

function newThread() {
  if (!currentProject) { alert("请先选择一个项目。"); return; }
  const title = prompt("新对话标题（留空自动生成）", "");
  api("POST", wizardPath("/threads"), { title: title || "" }).then(d => {
    if (d.error) { alert(d.error); return; }
    currentThread = d.thread_id;
    loadThreads();
  });
}

function renameThread() {
  if (!currentProject || !currentThread) { alert("请先选择一个对话。"); return; }
  const title = prompt("重命名对话", currentThread);
  if (title === null) return;
  api("PATCH", wizardPath("/threads/" + encodeURIComponent(currentThread)), { title }).then(d => {
    if (d.error) { alert(d.error); return; }
    loadThreads();
  });
}

/* ---------------- 消息流渲染 ---------------- */
function clearStream() {
  const el = document.getElementById("chatStream");
  el.innerHTML = '<div class="stream-inner"><div class="muted" id="emptyHint">选择左侧对话，或在下方直接提问。</div></div>';
}

function streamInner() {
  const el = document.getElementById("chatStream");
  let inner = el.querySelector(".stream-inner");
  if (!inner) {
    inner = document.createElement("div");
    inner.className = "stream-inner";
    el.appendChild(inner);
  }
  return inner;
}

/* 滚到底部：消息流是受限容器，但内容刚 append 时高度还没结算，
   直接同步 scrollTop 有时会落在旧高度上（表现为「跳到顶部」）。
   用 rAF 等一帧布局完成后再滚，并在下一帧再补一次以防图片/换行撑高。 */
function scrollToBottom() {
  const el = document.getElementById("chatStream");
  if (!el) return;
  const pin = () => { el.scrollTop = el.scrollHeight; };
  pin();
  requestAnimationFrame(() => {
    pin();
    requestAnimationFrame(pin);
  });
}

/* 用户手动往上翻时不打断阅读：只有已经贴近底部才自动跟随。 */
function isNearBottom(slack = 120) {
  const el = document.getElementById("chatStream");
  if (!el) return true;
  return el.scrollHeight - el.scrollTop - el.clientHeight <= slack;
}

/* 渲染一条已落盘的消息（含上次的思考过程）。 */
function renderMessage(role, content, references, createdAt) {
  const isUser = role === "user";
  const inner = streamInner();
  const hint = document.getElementById("emptyHint");
  if (hint) hint.remove();

  const turn = document.createElement("div");
  turn.className = "turn " + (isUser ? "user" : "agent");

  let thinkHtml = "";
  const steps = references && references.steps;
  if (!isUser && Array.isArray(steps) && steps.length) {
    const via = references.via === "llm" ? "大模型" : (references.via === "tool" ? "执行操作" : "规则");
    thinkHtml = `
      <details class="think">
        <summary>思考过程 · ${steps.length} 步 · ${escapeHtml(via)}</summary>
        <div class="think-body">
          ${steps.map(s => `
            <div class="tstep ${escapeHtml(s.status || '')}">
              <span class="dot"></span>
              <span><span class="lbl">${escapeHtml(s.label || '')}</span>
                ${s.detail ? `<span class="det">— ${escapeHtml(s.detail)}</span>` : ""}</span>
            </div>`).join("")}
        </div>
      </details>`;
  }

  turn.innerHTML = `
    <div class="who">${isUser ? "你" : "AI"}</div>
    <div class="body">
      ${thinkHtml}
      <div class="bubble">${escapeHtml(content)}</div>
      ${createdAt ? `<div class="stamp">${escapeHtml(humanTime(createdAt))}</div>` : ""}
    </div>`;
  inner.appendChild(turn);
  scrollToBottom();
  return turn;
}

function loadMessages() {
  if (!currentProject || !currentThread) { clearStream(); return; }
  api("GET", wizardPath("/threads/" + encodeURIComponent(currentThread) + "/messages")).then(d => {
    const msgs = d.messages || [];
    clearStream();
    if (!msgs.length) {
      streamInner().innerHTML = '<div class="muted">这个对话还没有消息。在下方提问开始吧。</div>';
      return;
    }
    const inner = streamInner();
    inner.innerHTML = "";
    msgs.forEach(m => renderMessage(m.role, m.content, m.references, m.created_at));
  });
}

function refreshState() {
  if (!currentProject) { setState("idle"); return; }
  api("GET", "/api/state?project=" + encodeURIComponent(currentProject)).then(d => {
    if (d && d.state) setState(d.state);
  });
}

/* ---------------- 流式发送 ---------------- */
function setComposerBusy(busy) {
  streaming = busy;
  const btn = document.getElementById("chatSend");
  const ta = document.getElementById("chatInput");
  if (btn) { btn.disabled = busy; btn.textContent = busy ? "生成中…" : "发送"; }
  if (ta) ta.disabled = busy;
}

/* 本轮进行中的思考块：步骤原地更新，正文逐段追加。
   ``echoUser`` 为 false 时不渲染用户气泡——resume（批准/拒绝）是接续上一轮，
   凭空插一句「（批准执行）」会污染会话记录。 */
function beginLiveTurn(question, echoUser = true) {
  if (echoUser) renderMessage("user", question, null, new Date().toISOString());

  const inner = streamInner();
  const turn = document.createElement("div");
  turn.className = "turn agent";
  turn.innerHTML = `
    <div class="who">AI</div>
    <div class="body">
      <details class="think" open>
        <summary id="liveThinkSummary">思考过程 · 进行中</summary>
        <div class="think-body" id="liveSteps"></div>
      </details>
      <div class="bubble plain" id="liveReply"></div>
    </div>`;
  inner.appendChild(turn);
  scrollToBottom();
  return turn;
}

function upsertStep(step) {
  const wrap = document.getElementById("liveSteps");
  if (!wrap) return;
  let row = wrap.querySelector(`[data-step="${step.id}"]`);
  if (!row) {
    row = document.createElement("div");
    row.dataset.step = step.id;
    wrap.appendChild(row);
  }
  row.className = "tstep " + (step.status || "");
  row.innerHTML = `
    <span class="dot"></span>
    <span><span class="lbl">${escapeHtml(step.label || '')}</span>
      ${step.detail ? `<span class="det">— ${escapeHtml(step.detail)}</span>` : ""}</span>`;
  const summary = document.getElementById("liveThinkSummary");
  if (summary) {
    const n = wrap.querySelectorAll("[data-step]").length;
    const running = wrap.querySelector(".tstep.running");
    summary.textContent = `思考过程 · ${n} 步${running ? " · 进行中" : " · 完成"}`;
  }
  scrollToBottom();
}

function appendDelta(text) {
  const bubble = document.getElementById("liveReply");
  if (!bubble) return;
  // 流式期间只在用户已贴近底部时跟随，避免把正在往上翻的人拽回去。
  const follow = isNearBottom();
  let span = bubble.querySelector(".live-text");
  if (!span) {
    bubble.innerHTML = '<span class="live-text"></span><span class="caret"></span>';
    span = bubble.querySelector(".live-text");
  }
  span.textContent += text;
  if (follow) scrollToBottom();
}

function finishLiveTurn(settled) {
  const bubble = document.getElementById("liveReply");
  if (bubble) {
    const caret = bubble.querySelector(".caret");
    if (caret) caret.remove();
    if (!bubble.textContent.trim()) {
      bubble.textContent = settled && settled.reply ? settled.reply : "（没有返回内容）";
    }
    const body = bubble.parentElement;
    const stamp = document.createElement("div");
    stamp.className = "stamp";
    stamp.textContent = humanTime(new Date().toISOString());
    body.appendChild(stamp);
  }
  const details = document.querySelector("details.think[open] #liveSteps");
  if (details) {
    const wrap = details.parentElement;
    if (wrap && wrap.tagName === "DETAILS") wrap.open = false;  // 完成后收起，保持版面干净
  }
  const summary = document.getElementById("liveThinkSummary");
  if (summary) summary.textContent = summary.textContent.replace("进行中", "完成");
  // 清掉本轮临时 id，避免下一轮误命中。
  ["liveSteps", "liveReply", "liveThinkSummary"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.removeAttribute("id");
  });
}

function sendMessage() {
  if (!currentProject) { alert("请先在左侧选择一个项目。"); return; }
  if (streaming) return;
  const input = document.getElementById("chatInput");
  const q = input.value.trim();
  if (!q) return;
  input.value = "";
  dispatch(q);
}

function quickAsk(text) {
  if (!currentProject) { alert("请先在左侧选择一个项目。"); return; }
  if (streaming) return;
  dispatch(text);
}

/* 与后端 /api/chat/stream 打交道：POST + 手工解析 SSE（fetch 的流式读取）。 */
async function dispatch(q) {
  setComposerBusy(true);
  beginLiveTurn(q);
  const hint = document.getElementById("viaHint");
  if (hint) hint.textContent = "";

  let settled = null;
  const url = "/api/chat/stream?project=" + encodeURIComponent(currentProject)
            + (currentThread ? "&thread=" + encodeURIComponent(currentThread) : "");
  try {
    const resp = await fetch(url, {
      method: "POST",
      headers: { "x-session-token": TOKEN, "content-type": "application/json" },
      body: JSON.stringify({ message: q, thread_id: currentThread || undefined }),
    });
    if (!resp.ok) {
      const text = await resp.text();
      showStreamError(text || ("HTTP " + resp.status));
      return;
    }
    await readSSE(resp, ev => { if (ev.event === "done") settled = ev.data; });
  } catch (err) {
    showStreamError("请求失败：" + String(err));
    return;
  } finally {
    finishLiveTurn(settled);
    setComposerBusy(false);
    if (settled) {
      if (settled.state) setState(settled.state);
      if (hint) {
        const via = settled.via === "llm" ? "大模型" : (settled.via === "tool" ? "执行操作" : "规则路由");
        hint.textContent = "本轮由" + via + "完成。" + (settled.gate ? " 门禁：" + settled.gate : "");
      }
      // 让新消息进入会话记录：重拉列表（首次对话会被自动创建）。
      if (settled.thread_id && settled.thread_id !== currentThread) {
        currentThread = settled.thread_id;
      }
      loadThreads();
    }
  }
}

function handleEvent(block, onDone) {
  let name = "";
  const dataLines = [];
  block.replace(/\r\n/g, "\n").split("\n").forEach(line => {
    if (line.startsWith("event:")) name = line.slice(6).trim();
    else if (line.startsWith("data:")) dataLines.push(line.slice(5).trim());
  });
  if (!name) return;
  let data = {};
  const raw = dataLines.join("\n");
  if (raw) { try { data = JSON.parse(raw); } catch (e) { data = {}; } }

  if (name === "step") upsertStep(data);
  else if (name === "delta") appendDelta(data.text || "");
  else if (name === "confirm") renderConfirmCard(data);
  else if (name === "error") showStreamError(data.message || "出错了");
  else if (name === "done") onDone({ event: name, data });
}

function showStreamError(message) {
  const bubble = document.getElementById("liveReply");
  if (bubble) bubble.innerHTML = `<span class="errbox">${escapeHtml(message)}</span>`;
}

/* 高风险操作的确认卡片：后端 interrupt 挂起后推 confirm 事件，这里渲染成
   批准 / 拒绝 卡片，用户点击后 POST /api/chat/resume 恢复同一张图的线程。
   模型不能替用户点这个按钮——写盘与执行的决定权始终在人手上。 */
function renderConfirmCard(payload) {
  const previous = document.getElementById("liveConfirm");
  if (previous) {
    previous.removeAttribute("id");
    const oldActs = previous.querySelector(".acts");
    if (oldActs) oldActs.remove();
    const replaced = document.createElement("div");
    replaced.className = "settled";
    replaced.textContent = "已被新的确认卡替换。";
    previous.appendChild(replaced);
  }
  const bubble = document.getElementById("liveReply");
  if (!bubble) return;
  const calls = Array.isArray(payload.calls) ? payload.calls : [];
  const rows = calls.map(c => `
    <div class="call">
      <span class="name">${escapeHtml(c.label || c.name || '')}</span>
      <span class="risk ${escapeHtml(c.risk || '')}">${escapeHtml(c.risk === 'execute' ? '执行' : '写入')}</span>
      <div class="desc">${escapeHtml(c.description || '')}</div>
    </div>`).join("");

  bubble.innerHTML = `
    <div class="confirm-card" id="liveConfirm">
      <div class="head">${escapeHtml(payload.message || '以下操作需要你确认后才会执行。')}</div>
      ${rows}
      <textarea class="note" id="liveConfirmNote" placeholder="可选：写一句备注（拒绝时模型会看到）"></textarea>
      <div class="acts">
        <button class="approve" id="liveConfirmApprove">批准执行</button>
        <button class="reject" id="liveConfirmReject">拒绝</button>
      </div>
    </div>`;
  const approve = document.getElementById("liveConfirmApprove");
  const reject = document.getElementById("liveConfirmReject");
  const approvalId = String(payload.approval_id || "");
  if (approve) approve.onclick = () => resolveConfirm(true, approvalId);
  if (reject) reject.onclick = () => resolveConfirm(false, approvalId);
  scrollToBottom();
}

/* 提交决定：卡片原地变成「已批准 / 已拒绝」，随后走同一套 SSE 处理。 */
async function resolveConfirm(approved, approvalId) {
  const card = document.getElementById("liveConfirm");
  if (!card || streaming) return;
  const noteEl = document.getElementById("liveConfirmNote");
  const note = noteEl ? noteEl.value.trim() : "";
  const acts = card.querySelector(".acts");
  if (acts) acts.remove();
  if (noteEl) noteEl.remove();
  const settled = document.createElement("div");
  settled.className = "settled";
  settled.textContent = approved ? "已批准，正在执行…" : "已拒绝，正在告诉模型…";
  card.appendChild(settled);

  setComposerBusy(true);
  // 恢复时沿用同一轮思考块：清掉旧 id 之外的内容，让后续 step/delta 能落位。
  const live = document.getElementById("liveReply");
  if (live) live.removeAttribute("id");
  await dispatchResume(approved, note, approvalId);
}

/* 与 /api/chat/resume 打交道：与 dispatch 共用 SSE 解析与收尾逻辑。 */
async function dispatchResume(approved, note, approvalId) {
  beginLiveTurn("", false);
  const hint = document.getElementById("viaHint");
  let settled = null;
  try {
    const resp = await fetch("/api/chat/resume?project=" + encodeURIComponent(currentProject), {
      method: "POST",
      headers: { "x-session-token": TOKEN, "content-type": "application/json" },
      body: JSON.stringify({
        project_id: currentProject,
        thread_id: currentThread || undefined,
        approval_id: approvalId,
        approved: approved,
        note: note,
      }),
    });
    if (!resp.ok) {
      showStreamError((await resp.text()) || ("HTTP " + resp.status));
      return;
    }
    await readSSE(resp, ev => { if (ev.event === "done") settled = ev.data; });
  } catch (err) {
    showStreamError("恢复执行失败：" + String(err));
    return;
  } finally {
    finishLiveTurn(settled);
    setComposerBusy(false);
    if (settled) {
      if (settled.state) setState(settled.state);
      if (hint) hint.textContent = "本轮由" + (settled.via === "llm" ? "大模型" : "执行操作") + "完成。";
      if (settled.thread_id && settled.thread_id !== currentThread) currentThread = settled.thread_id;
      loadThreads();
    }
  }
}

/* 统一的 SSE 流读取：dispatch 与 dispatchResume 共用，避免两处解析漂移。 */
async function readSSE(resp, onEvent) {
  const reader = resp.body.getReader();
  const decoder = new TextDecoder("utf-8");
  let buffer = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    // SSE 以空行分隔事件；最后一段可能不完整，留在 buffer 里。
    let sep;
    while ((sep = buffer.indexOf("\n\n")) >= 0) {
      const block = buffer.slice(0, sep);
      buffer = buffer.slice(sep + 2);
      handleEvent(block, onEvent);
    }
  }
  if (buffer.trim()) handleEvent(buffer, onEvent);
}

/* ---------------- 启动 ---------------- */
/* Enter 发送 / Shift+Enter 换行。用 document 级委托而不是直接绑到
   #chatInput：元素一旦缺失或脚本顺序变化，直接绑会抛错并让后续初始化
   全部中断（表现就是「点按钮能发、Enter 没反应」）。 */
document.addEventListener("keydown", e => {
  const t = e.target;
  if (!t || t.id !== "chatInput") return;
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    sendMessage();
  }
});

if (currentProject) document.getElementById("projectName").textContent = currentProject;
loadProjects();
loadThreads();
refreshState();
</script>
