<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYSU 多组学分析 Agent — 设置</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f6f8fa; --border: #d0d7de;
    --text: #1f2328; --muted: #656d76; --accent: #0969da;
    --accent-weak: #ddf4ff; --ok: #1a7f37; --warn: #9a6700; --err: #cf222e;
    --shadow: 0 1px 2px rgba(31,35,40,.06);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--text); }
  header { padding: 14px 24px; border-bottom: 1px solid var(--border);
           display: flex; align-items: center; gap: 16px; background: var(--panel); }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  nav { margin-left: auto; display: flex; gap: 10px; }
  nav a { color: var(--accent); text-decoration: none; font-size: 13px; }
  nav a:hover { text-decoration: underline; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 20px;
           border: 1px solid var(--border); color: var(--muted); background: var(--bg); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px; }
  h2 { font-size: 15px; margin: 26px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .card { background: var(--bg); border: 1px solid var(--border);
          border-radius: 10px; padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 150px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 8px 0 4px; }
  .hint { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px; }
  input { width: 100%; background: var(--bg); border: 1px solid var(--border);
        border-radius: 6px; color: var(--text); padding: 8px 10px; font-size: 13px; }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(9,105,218,.12); }
  button { background: var(--accent); color: #fff; border: none; border-radius: 6px;
           padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 12px; }
  button.secondary { background: var(--bg); border: 1px solid var(--border); color: var(--text); }
  button.secondary:hover { background: var(--panel); }
  .muted { color: var(--muted); font-size: 12px; }
  .ok { color: var(--ok); }
  .notice { background: rgba(26,127,55,.1); border: 1px solid rgba(26,127,55,.35);
            color: var(--ok); padding: 10px 12px; border-radius: 8px; font-size: 13px; }
  .hidden { display: none; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; background: var(--panel); border: 1px solid var(--border);
                color: var(--muted); padding: 8px 6px; margin-top: 6px; font-weight: 500; }
  .seg button.active { background: var(--accent-weak); border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>SYSU 多组学分析 Agent</h1>
  <span class="badge">localhost</span>
  <nav>
    <a href="/">项目首页</a>
    <a href="/workbench">分析工作台</a>
  </nav>
</header>

<div class="wrap">
  <div id="savedNotice" class="notice hidden">已保存。</div>

  <h2>HPC 连接</h2>
  <div class="card">
    <p class="muted" style="margin:0">本地执行请使用「local」调度器；远程执行请填登录节点信息。密钥认证优先于密码，密码仅保存在本机项目配置中。</p>
    <div class="row">
      <div><label>主机</label><input id="srvHost" placeholder="login.hpc"><div class="muted">本地执行填 localhost</div></div>
      <div><label>用户名</label><input id="srvUser" placeholder="user"></div>
      <div><label>SSH 端口</label><input id="srvPort" type="number" placeholder="22"></div>
    </div>
    <div class="row">
      <div><label>认证方式</label>
        <div class="seg">
          <button type="button" id="authKey" class="active" onclick="setAuth('key')">SSH 密钥</button>
          <button type="button" id="authPass" onclick="setAuth('pass')">密码</button>
        </div>
      </div>
      <div><label>&nbsp;</label>
        <input id="srvPass" type="password" placeholder="密码（仅密钥不可用时使用）" class="hidden">
        <div class="muted" id="srvKeyNote" style="margin-top:6px">默认使用 ~/.ssh/id_* 密钥；可在本机 ssh_config 中配置。</div>
      </div>
    </div>
    <div class="row">
      <div><label>调度器</label>
        <select id="srvScheduler">
          <option value="local">local（本机直接执行）</option>
          <option value="slurm">SLURM</option>
          <option value="pbs">PBS</option>
        </select></div>
      <div><label>线程数</label><input id="srvThreads" type="number" placeholder="8"></div>
      <div><label>内存 (GB)</label><input id="srvMemory" type="number" placeholder="32"></div>
    </div>
    <div>
      <label>远程工作目录 <span class="hint">项目文件与结果将存放在服务器该目录下（按项目 ID 分子目录）</span></label>
      <input id="srvRemoteDir" placeholder="/home/user/rnaseq_agent_work">
      <div class="muted">留空则由服务器端默认路径生成；新建项目时会写入具体路径。</div>
    </div>
    <div class="row">
      <div><label>远程基础目录</label><input id="srvRemoteBase" placeholder="服务器上的工作根目录"></div>
    </div>
    <button onclick="saveServer()">保存 HPC 配置</button>
  </div>

  <h2>AI 模型接入</h2>
  <div class="card">
    <div class="row">
      <div><label>API Base</label><input id="llmBase" placeholder="https://api.openai.com/v1"></div>
      <div><label>模型</label><input id="llmModel" placeholder="gpt-4o-mini"></div>
      <div><label>提供商（可选）</label><input id="llmProvider" placeholder="openai / deepseek / ..."></div>
    </div>
    <div class="row">
      <div><label>API Key <span class="muted" id="llmKeyState"></span></label>
        <input id="llmKey" type="password" placeholder="sk-..."></div>
      <div><label>&nbsp;</label>
        <label style="display:flex;align-items:center;gap:6px;margin-top:10px;font-weight:400">
          <input type="checkbox" id="llmEnabled" style="width:auto"> 启用大模型对话
        </label>
      </div>
    </div>
    <button onclick="saveLlm()">保存 AI 配置</button>
    <button class="secondary" onclick="clearKey()">清除 API Key</button>
    <div class="muted" style="margin-top:8px">未启用或请求失败时，对话自动回退本地规则路由。</div>
  </div>
</div>

<script>
const TOKEN = "{{ token }}";
let authMode = "key";
async function api(path, method, body) {
  const opts = { method: method || "GET", headers: { "content-type": "application/json", "x-session-token": TOKEN } };
  if (body) opts.body = JSON.stringify(body);
  const resp = await fetch(path, opts);
  return resp.json();
}
function flash() {
  const el = document.getElementById("savedNotice");
  el.classList.remove("hidden");
  setTimeout(() => el.classList.add("hidden"), 2500);
}
function setAuth(mode) {
  authMode = mode;
  document.getElementById("authKey").classList.toggle("active", mode === "key");
  document.getElementById("authPass").classList.toggle("active", mode === "pass");
  document.getElementById("srvPass").classList.toggle("hidden", mode !== "pass");
  document.getElementById("srvKeyNote").classList.toggle("hidden", mode !== "key");
}
function load() {
  api("/api/config").then(d => {
    const c = d.config;
    if (!c) return;
    document.getElementById("srvHost").value = c.server.host || "";
    document.getElementById("srvUser").value = c.server.user || "";
    document.getElementById("srvPort").value = c.server.port ?? 22;
    document.getElementById("srvScheduler").value = c.server.scheduler || "local";
    document.getElementById("srvThreads").value = c.server.threads ?? "";
    document.getElementById("srvMemory").value = c.server.memory_gb ?? "";
    document.getElementById("srvRemoteBase").value = c.server.remote_base_dir || "";
    document.getElementById("srvRemoteDir").value = c.server.remote_workdir || "";
    if (c.server.auth_mode) setAuth(c.server.auth_mode);
    if (c.server.port && Number(c.server.port) !== 22) setAuth("pass");
    document.getElementById("llmBase").value = c.llm.api_base || "";
    document.getElementById("llmModel").value = c.llm.model || "";
    document.getElementById("llmProvider").value = c.llm.provider || "";
    document.getElementById("llmEnabled").checked = !!c.llm.enabled;
    document.getElementById("llmKeyState").textContent = c.llm.api_key_set ? "（已设置）" : "（未设置）";
  });
}
function saveServer() {
  const server = {
    host: document.getElementById("srvHost").value.trim(),
    user: document.getElementById("srvUser").value.trim(),
    port: document.getElementById("srvPort").value.trim(),
    scheduler: document.getElementById("srvScheduler").value,
    threads: document.getElementById("srvThreads").value.trim(),
    memory_gb: document.getElementById("srvMemory").value.trim(),
    remote_base_dir: document.getElementById("srvRemoteBase").value.trim(),
    remote_workdir: document.getElementById("srvRemoteDir").value.trim(),
    auth_mode: authMode,
  };
  if (authMode === "pass" && document.getElementById("srvPass").value.trim()) {
    server.password = document.getElementById("srvPass").value.trim();
  }
  Object.keys(server).forEach(k => { if (server[k] === "") delete server[k]; });
  if (server.threads) server.threads = Number(server.threads);
  if (server.memory_gb) server.memory_gb = Number(server.memory_gb);
  if (server.port) server.port = Number(server.port);
  api("/api/config", "POST", { server }).then(d => {
    if (d.error) { alert(d.error); return; }
    document.getElementById("srvPass").value = "";
    flash();
  });
}
function saveLlm() {
  const llm = {
    provider: document.getElementById("llmProvider").value.trim(),
    api_base: document.getElementById("llmBase").value.trim(),
    model: document.getElementById("llmModel").value.trim(),
    enabled: document.getElementById("llmEnabled").checked,
  };
  Object.keys(llm).forEach(k => { if (llm[k] === "") delete llm[k]; });
  const key = document.getElementById("llmKey").value.trim();
  if (key) llm.api_key = key;
  api("/api/config", "POST", { llm }).then(d => {
    if (d.error) { alert(d.error); return; }
    document.getElementById("llmKey").value = "";
    flash();
  });
}
function clearKey() {
  api("/api/config", "POST", { llm: { api_key_clear: true } }).then(d => {
    if (d.error) alert(d.error); else { document.getElementById("llmKeyState").textContent = "（未设置）"; flash(); }
  });
}
{% if session.config %}load();{% endif %}
</script>
</body>
</html>
