<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYSU 多组学分析 Agent — 分析工作台</title>
<style>
  :root {
    --bg: #0f1420; --panel: #1a2130; --border: #2b3550;
    --text: #e6e9f0; --muted: #8b94a8; --accent: #4da3ff;
    --ok: #3ecf8e; --warn: #f0b429; --err: #e05c5c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--text); }
  header { padding: 12px 24px; border-bottom: 1px solid var(--border);
           display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .crumb { color: var(--muted); font-size: 13px; }
  nav { margin-left: auto; display: flex; gap: 10px; }
  nav a { color: var(--accent); text-decoration: none; font-size: 13px; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 20px;
           border: 1px solid var(--border); color: var(--muted); }
  .state { font-size: 12px; padding: 3px 10px; border-radius: 20px; }
  .state.planned { background: rgba(77,163,255,.15); color: var(--accent); }
  .state.confirmed { background: rgba(62,207,142,.15); color: var(--ok); }
  .state.waiting { background: rgba(240,180,41,.18); color: var(--warn); }
  .state.waiting_user { background: rgba(240,180,41,.18); color: var(--warn); }
  .state.drafting { background: rgba(139,148,168,.15); color: var(--muted); }
  .state.completed { background: rgba(62,207,142,.15); color: var(--ok); }
  .state.failed, .state.error { background: rgba(224,92,92,.15); color: var(--err); }
  .state.idle { background: rgba(139,148,168,.15); color: var(--muted); }

  .layout { display: grid; grid-template-columns: 250px 1fr 320px; height: calc(100vh - 60px); }
  .left { border-right: 1px solid var(--border); padding: 14px; overflow: auto; }
  .middle { padding: 16px 20px; overflow: auto; }
  .right { border-left: 1px solid var(--border); padding: 14px; overflow: auto; }

  h2 { font-size: 12px; color: var(--muted); text-transform: uppercase;
       letter-spacing: .5px; margin: 16px 0 8px; }
  .card { background: var(--panel); border: 1px solid var(--border);
          border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 8px; font-size: 14px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
  input, textarea { width: 100%; background: var(--bg); border: 1px solid var(--border);
        border-radius: 6px; color: var(--text); padding: 7px 9px; font-size: 13px; }
  textarea { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  button { background: var(--accent); color: #fff; border: none; border-radius: 6px;
           padding: 7px 14px; font-size: 13px; cursor: pointer; margin-top: 10px; }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  button.small { padding: 4px 9px; font-size: 12px; margin-top: 4px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .muted { color: var(--muted); font-size: 12px; }
  .mono { font-family: ui-monospace, Consolas, monospace; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); }
  .step { font-size: 12px; color: var(--muted); padding: 2px 0; }
  .notice { background: rgba(240,180,41,.12); border: 1px solid rgba(240,180,41,.4);
            color: var(--warn); padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
  .hidden { display: none; }

  .list { list-style: none; margin: 0; padding: 0; }
  .list li { padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px;
             display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .list li:hover { background: rgba(77,163,255,.08); }
  .list li.active { background: rgba(77,163,255,.16); border: 1px solid var(--accent); }
  .list .sub { color: var(--muted); font-size: 11px; }

  .tabs { display: flex; gap: 4px; margin-bottom: 10px; }
  .tabs button { flex: 1; background: transparent; border: 1px solid var(--border);
                 color: var(--muted); padding: 7px 4px; margin-top: 0; font-size: 12px; }
  .tabs button.active { color: var(--accent); border-color: var(--accent); }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--border); color: var(--text); }
  th { color: var(--muted); font-weight: 500; }
  .sample-input { display: grid; grid-template-columns: 1fr 1fr 1.2fr 1.2fr 1fr; gap: 6px; margin-bottom: 6px; }
</style>
</head>
<body>
<header>
  <h1>SYSU 多组学分析 Agent</h1>
  <span class="badge">localhost</span>
  <span class="crumb" id="projectName">未选择项目</span>
  <span id="stateBadge" class="state"></span>
  <nav>
    <a href="/">项目首页</a>
    <a href="/settings">设置</a>
  </nav>
</header>

<div class="layout">
  <!-- ============ 左栏：项目与对话 ============ -->
  <div class="left">
    <h2>项目</h2>
    <div class="card">
      <ul class="list" id="projectList"><li class="muted">加载中…</li></ul>
    </div>

    <h2>对话</h2>
    <div class="card">
      <ul class="list" id="threadList"><li class="muted">请先选择一个项目。</li></ul>
      <div class="row">
        <button class="small" onclick="newThread()">新建对话</button>
        <button class="small secondary" onclick="renameThread()">重命名</button>
        <button class="small secondary" onclick="archiveThread()">归档</button>
      </div>
    </div>
  </div>

  <!-- ============ 中栏：对话与决策 ============ -->
  <div class="middle">
    <div id="qcNotice" class="notice hidden">
      <b>QC 检查点（框架 6.1）</b>：fastp QC 已完成。请审阅后确认，进入 STAR 比对。
      <button onclick="resumeQc()">确认 QC，继续</button>
    </div>

    <h2>当前对话</h2>
    <div class="card">
      <div class="muted" id="threadTitle">（未选择对话）</div>
      <div id="messages" class="muted"></div>
    </div>

    <h2>新建项目草稿</h2>
    <div class="card">
      <div class="row">
        <div><label>项目 ID</label><input id="projectId" placeholder="demo_001"></div>
        <div><label>项目名称</label><input id="title" placeholder="Bulk RNA 差异分析"></div>
        <div><label>癌种</label><input id="cancerType" value="pan_cancer"></div>
      </div>
      <div class="row">
        <div><label>实验设计</label><input id="design" value="independent_two_group"></div>
        <div><label>本地 FASTQ 目录</label><input id="fastqDir" value="outputs/mvp_demo_data"></div>
        <div><label>负责人</label><input id="owner" value="local_user"></div>
      </div>
      <label>样本（sample_id, condition, R1, R2, batch[可选]）</label>
      <div class="sample-input">
        <input class="s-id" placeholder="ctrl_1"><input class="s-cond" placeholder="control">
        <input class="s-r1" placeholder="ctrl_1_R1.fastq.gz"><input class="s-r2" placeholder="ctrl_1_R2.fastq.gz">
        <input class="s-batch" placeholder="batch">
      </div>
      <div class="sample-input">
        <input class="s-id" placeholder="trt_1"><input class="s-cond" placeholder="treatment">
        <input class="s-r1" placeholder="trt_1_R1.fastq.gz"><input class="s-r2" placeholder="trt_1_R2.fastq.gz">
        <input class="s-batch" placeholder="batch">
      </div>
      <button onclick="createDraft()">创建项目草稿</button>
    </div>

    <h2>流程</h2>
    <div class="card">
      <div id="planSteps" class="muted">尚未生成计划。创建项目草稿后点击「生成执行计划」。</div>
      <div class="row">
        <button onclick="doPlan()">生成执行计划</button>
        <button id="confirmBtn" class="secondary" onclick="doConfirm()">确认并冻结契约</button>
        <button class="secondary" onclick="doRollback()">回滚</button>
      </div>
    </div>

    <h2>差异表达（条件开放）</h2>
    <div class="card">
      <div id="degStatus" class="muted">DESeq2 两组对比。需要样本满足设计门禁（两组、每组 ≥3、batch 不混杂）才能启用。</div>
      <div class="row">
        <button class="secondary" onclick="toggleDeg(true)">启用差异表达</button>
        <button class="secondary" onclick="toggleDeg(false)">关闭差异表达</button>
        <button class="secondary" onclick="degGate()">查看 DEG 门禁</button>
      </div>
    </div>

    <h2>对话与决策</h2>
    <div class="card">
      <textarea id="chatInput" rows="3"
        placeholder="向 Agent 提问，例如：请解释当前流程的 QC 阈值"></textarea>
      <button onclick="sendChat()">发送</button>
      <div id="chatReply" class="muted" style="margin-top:10px"></div>
    </div>
  </div>

  <!-- ============ 右栏：项目上下文 ============ -->
  <div class="right">
    <h2>项目上下文</h2>
    <div class="tabs">
      <button id="tab-flow" class="active" onclick="switchTab('flow')">流程</button>
      <button id="tab-samples" onclick="switchTab('samples')">样本</button>
      <button id="tab-runs" onclick="switchTab('runs')">运行</button>
      <button id="tab-results" onclick="switchTab('results')">结果</button>
    </div>
    <div id="panel-flow" class="card"></div>
    <div id="panel-samples" class="card hidden"></div>
    <div id="panel-runs" class="card hidden"></div>
    <div id="panel-results" class="card hidden"></div>
  </div>
</div>

<script>
const TOKEN = "{{ token }}";
const INITIAL_PROJECT = "{{ project_id }}";
let currentProject = INITIAL_PROJECT || "";
let currentThread = "";
let activeTab = "flow";

async function api(method, path, body) {
  const opts = { method, headers: { "x-session-token": TOKEN } };
  if (body !== undefined) {
    opts.headers["content-type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const resp = await fetch(path, opts);
  if (!resp.ok) {
    const text = await resp.text();
    return { error: text, status: resp.status };
  }
  return resp.json();
}

// 旧的单项目会话端点：把当前选中的项目作为 ``?project=`` 带上。
function legacy(path) {
  if (!currentProject) return path;
  return path + (path.indexOf("?") >= 0 ? "&" : "?") + "project=" + encodeURIComponent(currentProject);
}

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function setState(state) {
  const badge = document.getElementById("stateBadge");
  const s = String(state || "");
  badge.textContent = s;
  badge.className = "state " + s.toLowerCase().replace("waiting_user", "waiting");
  document.getElementById("confirmBtn").disabled = s !== "planned";
}

/* ---------- 左栏：项目 ---------- */
function renderProjects(rows) {
  const el = document.getElementById("projectList");
  if (!rows || !rows.length) {
    el.innerHTML = "<li class='muted'>还没有项目。请到「项目首页」新建。</li>";
    return;
  }
  el.innerHTML = rows.map(p => `
    <li class="${p.project_id === currentProject ? 'active' : ''}" onclick="selectProject('${escapeHtml(p.project_id)}')">
      <div style="min-width:0">
        <div>${escapeHtml(p.title || p.project_id)}</div>
        <div class="sub">${escapeHtml(p.project_id)} · ${escapeHtml(p.state)}</div>
      </div>
    </li>`).join("");
}

function loadProjects() {
  api("GET", "/api/projects").then(d => renderProjects(d.projects || []));
}

function selectProject(id) {
  currentProject = id;
  currentThread = "";
  const url = new URL(window.location.href);
  url.searchParams.set("project", id);
  history.pushState({}, "", url);
  document.getElementById("projectName").textContent = id;
  loadProjects();
  loadThreads();
  refreshAll();
}

/* ---------- 左栏：对话 ---------- */
function renderThreads(rows) {
  const el = document.getElementById("threadList");
  if (!currentProject) {
    el.innerHTML = "<li class='muted'>请先选择一个项目。</li>";
    return;
  }
  if (!rows || !rows.length) {
    el.innerHTML = "<li class='muted'>该项目还没有对话。</li>";
    return;
  }
  el.innerHTML = rows.map(t => `
    <li class="${t.thread_id === currentThread ? 'active' : ''}" onclick="selectThread('${escapeHtml(t.thread_id)}')">
      <div style="min-width:0">
        <div>${escapeHtml(t.title || t.thread_id)}</div>
        <div class="sub">${escapeHtml(t.thread_id)} · ${t.message_count || 0} 条消息</div>
      </div>
    </li>`).join("");
}

function loadThreads() {
  if (!currentProject) { renderThreads([]); return; }
  api("GET", "/api/projects/" + encodeURIComponent(currentProject) + "/threads")
    .then(d => renderThreads(d.threads || []));
}

function selectThread(tid) {
  currentThread = tid;
  loadThreads();
  document.getElementById("threadTitle").textContent = tid;
  loadMessages();
}

function loadMessages() {
  const el = document.getElementById("messages");
  if (!currentProject || !currentThread) { el.innerHTML = ""; return; }
  api("GET", "/api/projects/" + encodeURIComponent(currentProject) + "/threads/"
    + encodeURIComponent(currentThread) + "/messages").then(d => {
      const msgs = d.messages || [];
      if (!msgs.length) { el.innerHTML = "<div class='step'>暂无消息。</div>"; return; }
      el.innerHTML = msgs.map(m =>
        `<div class="step"><b>${escapeHtml(m.role)}：</b>${escapeHtml(m.content)}</div>`).join("");
    });
}

function newThread() {
  if (!currentProject) { alert("请先选择一个项目。"); return; }
  const title = prompt("新对话标题（留空自动生成）", "");
  api("POST", "/api/projects/" + encodeURIComponent(currentProject) + "/threads",
    { title: title || "" }).then(d => {
      if (d.error) { alert(d.error); return; }
      selectThread(d.thread_id);
    });
}

function renameThread() {
  if (!currentProject || !currentThread) { alert("请先选择一个对话。"); return; }
  const title = prompt("重命名对话", currentThread);
  if (title === null) return;
  api("PATCH", "/api/projects/" + encodeURIComponent(currentProject) + "/threads/"
    + encodeURIComponent(currentThread), { title: title }).then(d => {
      if (d.error) { alert(d.error); return; }
      document.getElementById("threadTitle").textContent = d.title;
      loadThreads();
    });
}

function archiveThread() {
  if (!currentProject || !currentThread) { alert("请先选择一个对话。"); return; }
  if (!confirm("归档对话 " + currentThread + "？分析数据不会删除。")) return;
  api("DELETE", "/api/projects/" + encodeURIComponent(currentProject) + "/threads/"
    + encodeURIComponent(currentThread)).then(d => {
      if (d.error) { alert(d.error); return; }
      currentThread = "";
      document.getElementById("threadTitle").textContent = "（未选择对话）";
      document.getElementById("messages").innerHTML = "";
      loadThreads();
    });
}

/* ---------- 中栏：会话操作（全部绑定当前 project） ---------- */
function createDraft() {
  const samples = [];
  document.querySelectorAll(".sample-input").forEach(row => {
    const id = row.querySelector(".s-id").value.trim();
    const cond = row.querySelector(".s-cond").value.trim();
    const r1 = row.querySelector(".s-r1").value.trim();
    const r2 = row.querySelector(".s-r2").value.trim();
    const batch = row.querySelector(".s-batch").value.trim();
    if (id && cond && r1) samples.push({ sample_id: id, condition: cond, fastq_1: r1, fastq_2: r2, batch: batch || undefined });
  });
  api("POST", legacy("/api/new"), {
    project_id: document.getElementById("projectId").value || currentProject,
    title: document.getElementById("title").value,
    cancer_type: document.getElementById("cancerType").value,
    design: document.getElementById("design").value,
    fastq_dir: document.getElementById("fastqDir").value,
    owner: document.getElementById("owner").value,
    samples,
  }).then(d => {
    if (d.error) { alert(d.error); return; }
    setState(d.state);
    refreshAll();
  });
}

function doPlan() {
  api("POST", legacy("/api/plan")).then(d => {
    if (d.error) { document.getElementById("planSteps").innerHTML = `<span class="err">${escapeHtml(d.error)}</span>`; return; }
    document.getElementById("planSteps").innerHTML =
      (d.steps || []).map(s => `<div class="step">${escapeHtml(s)}</div>`).join("");
    setState(d.state);
  });
}

function doConfirm() {
  api("POST", legacy("/api/confirm")).then(d => {
    if (d.error) { alert(d.error); return; }
    document.getElementById("planSteps").innerHTML +=
      `<div class="step ok">契约已冻结：${escapeHtml(String(d.contract_id).slice(0, 24))}…</div>`;
    setState(d.state);
  });
}

function doRollback() {
  api("POST", legacy("/api/rollback"), {}).then(d => {
    if (d.error) alert(d.error); else { setState(d.state); refreshState(); }
  });
}

function resumeQc() {
  if (!currentProject) return;
  api("POST", "/api/projects/" + encodeURIComponent(currentProject) + "/graph/resume",
    { approved: true }).then(d => {
      if (d.error) { alert(d.error); return; }
      refreshAll();
    });
}

function renderDeg(d) {
  const el = document.getElementById("degStatus");
  if (d.error) { el.innerHTML = `<span class="err">${escapeHtml(d.error)}</span>`; return; }
  const lines = [];
  lines.push(d.requested ? `状态：已启用（${escapeHtml(d.formula)}）` : "状态：未启用");
  if (d.design) lines.push(`对比：${escapeHtml(d.design.contrast)}（reference=${escapeHtml(d.design.reference_condition)}）`);
  if (d.gate_ok) {
    lines.push(`<span class="ok">设计门禁通过</span>`);
  } else {
    lines.push(`<span class="err">设计门禁未通过：</span>`);
    (d.gate_reasons || []).forEach(r => lines.push(`<div class="step">- ${escapeHtml(r)}</div>`));
  }
  el.innerHTML = lines.join("<br>");
}

function toggleDeg(enabled) {
  api("POST", legacy("/api/deg"), { enabled }).then(d => {
    if (d.error) { alert(d.error); return; }
    renderDeg(d);
    if (d.state) setState(d.state);
    refreshState();
  });
}

function degGate() {
  api("POST", legacy("/api/deg"), {}).then(d => renderDeg(d));
}

function sendChat() {
  const q = document.getElementById("chatInput").value.trim();
  if (!q) return;
  const reply = document.getElementById("chatReply");
  reply.innerHTML = "<span class='muted'>你：</span>" + escapeHtml(q) + "<br><span class='muted'>Agent：处理中…</span>";
  api("POST", legacy("/api/chat"), { message: q }).then(d => {
    const head = "<span class='muted'>你：</span>" + escapeHtml(q) + "<br>";
    const via = d.via === "llm" ? "（大模型）" : "（规则）";
    let body = escapeHtml(d.reply || d.error || "完成。");
    if (d.steps) body += "<br>" + d.steps.map(s => `<div class="step">${escapeHtml(s)}</div>`).join("");
    if (d.summary) body += "<br>" + d.summary.map(s => `<div class="step">${escapeHtml(s)}</div>`).join("");
    if (d.gate && Array.isArray(d.gate)) body += "<br>" + d.gate.map(s => `<div class="step err">${escapeHtml(s)}</div>`).join("");
    reply.innerHTML = head + "<b>Agent" + via + "：</b>" + body;
    if (d.state) setState(d.state);
    refreshState();
  }).catch(err => {
    reply.innerHTML = "<span class='err'>请求失败：" + escapeHtml(String(err)) + "</span>";
  });
}

function setQc(waiting) {
  document.getElementById("qcNotice").classList.toggle("hidden", !waiting);
}

function refreshState() {
  api("GET", legacy("/api/state")).then(d => {
    if (d.error) return;
    setState(d.state);
  });
}

function refreshGraph() {
  if (!currentProject) { setQc(false); return; }
  api("GET", "/api/projects/" + encodeURIComponent(currentProject) + "/graph/state").then(d => {
    if (d.error) { setQc(false); return; }
    setQc(d.state === "WAITING_USER");
  });
}

function refreshAll() {
  refreshState();
  refreshGraph();
  loadTab(activeTab);
}

/* ---------- 右栏：项目上下文（四个页签） ---------- */
function switchTab(name) {
  activeTab = name;
  ["flow", "samples", "runs", "results"].forEach(t => {
    document.getElementById("tab-" + t).classList.toggle("active", t === name);
    document.getElementById("panel-" + t).classList.toggle("hidden", t !== name);
  });
  loadTab(name);
}

function loadTab(name) {
  if (name === "flow") loadFlow();
  else if (name === "samples") loadSamples();
  else if (name === "runs") loadRuns();
  else if (name === "results") loadResults();
}

function graphStatePath() {
  return "/api/projects/" + encodeURIComponent(currentProject) + "/graph/state";
}

function loadFlow() {
  const el = document.getElementById("panel-flow");
  if (!currentProject) { el.innerHTML = "<div class='muted'>请先选择一个项目。</div>"; return; }
  api("GET", graphStatePath()).then(d => {
    if (d.error) { el.innerHTML = `<div class="err">${escapeHtml(d.error)}</div>`; return; }
    const gs = d.graph_state || {};
    const lines = [];
    lines.push(`<div class="step">状态：<b>${escapeHtml(d.state)}</b></div>`);
    if (d.in_flight) lines.push(`<div class="step warn">运行中…</div>`);
    if (d.interrupt) lines.push(`<div class="step warn">检查点：${escapeHtml(JSON.stringify(d.interrupt))}</div>`);
    if (gs.status) lines.push(`<div class="step">graph status：${escapeHtml(gs.status)}</div>`);
    if (gs.message) lines.push(`<div class="step">${escapeHtml(gs.message)}</div>`);
    if (Array.isArray(gs.steps)) lines.push(gs.steps.map(s => `<div class="step">- ${escapeHtml(s)}</div>`).join(""));
    el.innerHTML = lines.join("");
  });
}

function loadSamples() {
  const el = document.getElementById("panel-samples");
  if (!currentProject) { el.innerHTML = "<div class='muted'>请先选择一个项目。</div>"; return; }
  api("GET", legacy("/api/state")).then(d => {
    if (d.error) { el.innerHTML = `<div class="err">${escapeHtml(d.error)}</div>`; return; }
    const samples = d.samples || [];
    if (!samples.length) {
      el.innerHTML = "<div class='muted'>尚未登记样本。创建项目草稿后这里会显示样本表。</div>";
      return;
    }
    let html = `<table><tr><th>样本</th><th>条件</th><th>R1</th><th>R2</th><th>batch</th></tr>`;
    samples.forEach(s => {
      html += `<tr><td>${escapeHtml(s.sample_id || "")}</td><td>${escapeHtml(s.condition || "")}</td>`
        + `<td class="mono">${escapeHtml(s.fastq_1 || "")}</td><td class="mono">${escapeHtml(s.fastq_2 || "")}</td>`
        + `<td>${escapeHtml(s.batch || "")}</td></tr>`;
    });
    html += "</table>";
    el.innerHTML = html;
  });
}

function loadRuns() {
  const el = document.getElementById("panel-runs");
  if (!currentProject) { el.innerHTML = "<div class='muted'>请先选择一个项目。</div>"; return; }
  api("GET", graphStatePath()).then(d => {
    if (d.error) { el.innerHTML = `<div class="err">${escapeHtml(d.error)}</div>`; return; }
    el.innerHTML =
      `<div class="step">状态：<b>${escapeHtml(d.state)}</b></div>`
      + `<div class="step">运行中：${d.in_flight ? "是" : "否"}</div>`
      + (d.error ? `<div class="step err">${escapeHtml(d.error)}</div>` : "");
  });
}

function loadResults() {
  const el = document.getElementById("panel-results");
  if (!currentProject) { el.innerHTML = "<div class='muted'>请先选择一个项目。</div>"; return; }
  api("GET", graphStatePath()).then(d => {
    if (d.error) { el.innerHTML = `<div class="err">${escapeHtml(d.error)}</div>`; return; }
    const gs = d.graph_state || {};
    const status = gs.status || d.state;
    el.innerHTML =
      `<div class="step">运行结果：<b>${escapeHtml(status)}</b></div>`
      + (gs.message ? `<div class="step">${escapeHtml(gs.message)}</div>` : "")
      + `<div class="muted" style="margin-top:8px">结果产物链接将在执行完成后由运行面板提供。</div>`;
  });
}

/* ---------- 初始化 ---------- */
document.getElementById("projectId").value = currentProject;
document.getElementById("projectName").textContent = currentProject || "未选择项目";
loadProjects();
loadThreads();
refreshAll();
</script>
</body>
</html>
