[project]
name = "sysu-rnaseq-agent"
version = "0.3.0"
description = "Interactive RNA-seq analysis agent for local orchestration and remote server execution."
requires-python = ">=3.11"
dependencies = [
  "paramiko>=3.4,<5"
]

# 框架 5.1/11：LangGraph 控制面与 localhost 网页（可选控制面依赖）。
[project.optional-dependencies]
control-plane = [
  "langgraph>=0.2",
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "jinja2>=3.1",
]
authors = [
  { name = "Qi Zhao", email = "zhaoqi@sysucc.org.cn" }
]

[project.scripts]
rnaseq-agent = "rnaseq_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
